<svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- land base -->
  <rect width="800" height="400" fill="#0e131c"/>

  <!-- parks / green spaces -->
  <g fill="#11241a">
    <path d="M50 30 Q150 14 190 70 Q210 134 120 152 Q30 142 34 86 Z"/>
    <rect x="600" y="60" width="150" height="90" rx="14"/>
    <path d="M620 270 Q720 250 756 308 Q772 372 672 384 Q596 366 600 318 Z"/>
  </g>

  <!-- water along the bottom and a river -->
  <path d="M-40 372 C120 340 220 392 340 350 C460 308 540 372 660 340 C730 322 780 350 840 330 L840 440 L-40 440 Z"
        fill="#112a40"/>
  <path d="M250 -40 C280 90 210 150 250 250 C282 330 250 410 280 460"
