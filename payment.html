<main class="container tv-page">
  <a class="back-link" href="javascript:history.back()"><i class="ph ph-arrow-left"></i> Make Payment</a>

  <div class="tv-grid">
    <div class="tv-main">
      <div id="tvFlights"></div>

      <h2 class="tv-section-title">Payment Method</h2>
      <p class="tv-note">Choose how you'd like to pay. Your booking is held at today's price while you complete payment.</p>

      <div class="pm-card">
        <div class="pm-tabs" id="pmTabs">
          <button type="button" class="pm-tab active" data-m="pss"><span>Pay Small Small</span><i class="ph ph-caret-right"></i></button>
          <button type="button" class="pm-tab" data-m="bank"><span>Pay with Bank Transfer</span><i class="ph ph-caret-right"></i></button>
          <button type="button" class="pm-tab" data-m="card"><span>Card Payment</span><i class="ph ph-caret-right"></i></button>
        </div>
        <div class="pm-panel" id="pmPanel"></div>
      </div>
    </div>

    <aside class="tv-side">
      <div class="tv-summary">
        <h2 class="tv-summary-title">Fare Summary</h2>
        <p class="tv-summary-pax" id="tvPax">Passenger x 1</p>
        <div class="tv-sum-row"><span>Flight</span><span id="tvFlightAmt"></span></div>
        <div id="teSumExtras"></div>
        <div class="tv-sum-row"><span>Taxes</span><span id="tvTaxAmt"></span></div>
        <div class="tv-sum-row tv-sum-due"><span>Amount Due</span><span id="tvDueAmt"></span></div>
      </div>
    </aside>
  </div>
</main>

<script>
  const params = new URLSearchParams(location.search);
  const fromCity = params.get('from') || 'Lagos';
  const fromCode = (params.get('fromCode') || 'LOS').toUpperCase();
  const toCity   = params.get('to') || 'Abuja';
  const toCode   = (params.get('toCode') || 'ABV').toUpperCase();
  const departTxt = params.get('depart') || 'Tue, Jun 02';
  const returnTxt = params.get('return') || 'Thu, Jun 04';
  const paxTxt   = params.get('pax') || '1 Passenger';
  const cabin    = params.get('class') || 'Economy';
  const paxCount = Math.max(1, parseInt(paxTxt, 10) || 1);

  const AIRLINES = [
    { name: 'Air Peace',      color: '#d22730', code: 'P4' },
    { name: 'Arik Air',       color: '#1f6feb', code: 'W3' },
    { name: 'Ibom Air',       color: '#16a34a', code: 'QI' },
    { name: 'Dana Air',       color: '#e0a800', code: '9J' },
    { name: 'Green Africa',   color: '#65a30d', code: 'Q9' },
    { name: 'United Nigeria', color: '#0ea5e9', code: 'U9' },
  ];
  const initials = name => name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const AIRPORT_NAMES = {
    LOS: 'Murtala Muhammed International Airport',
    ABV: 'Nnamdi Azikwe International Airport',
    KAN: 'Mallam Aminu Kano International Airport',
    ENU: 'Akanu Ibiam International Airport',
    PHC: 'Port Harcourt International Airport',
    QOW: 'Sam Mbakwe International Airport',
    BNI: 'Benin Airport',
    KAD: 'Kaduna International Airport',
  };
  const airportName = code => AIRPORT_NAMES[code] || (code + ' Airport');

  const FLIGHTS = [
    { al: 2, dep: 6*60+5,   dur: 95,  stops: 0, price: 48500 },
    { al: 4, dep: 6*60+40,  dur: 110, stops: 0, price: 51200 },
    { al: 2, dep: 7*60+10,  dur: 105, stops: 0, price: 52000 },
    { al: 0, dep: 8*60,     dur: 100, stops: 0, price: 58900 },
    { al: 1, dep: 9*60+25,  dur: 215, stops: 1, price: 44300, lay: 0 },
    { al: 3, dep: 10*60+15, dur: 100, stops: 0, price: 61500 },
    { al: 5, dep: 11*60+45, dur: 230, stops: 1, price: 46800, lay: 1 },
    { al: 0, dep: 13*60+5,  dur: 95,  stops: 0, price: 67200 },
    { al: 4, dep: 14*60+30, dur: 250, stops: 1, price: 49900, lay: 2 },
    { al: 2, dep: 15*60+50, dur: 100, stops: 0, price: 72000 },
    { al: 1, dep: 17*60+20, dur: 105, stops: 0, price: 69500 },
    { al: 3, dep: 18*60+40, dur: 360, stops: 2, price: 43200, lay: 0 },
    { al: 5, dep: 19*60+55, dur: 110, stops: 0, price: 75800 },
    { al: 0, dep: 21*60+10, dur: 100, stops: 0, price: 81000 },
    { al: 2, dep: 22*60+30, dur: 240, stops: 1, price: 47100, lay: 1 },
    { al: 4, dep: 23*60+45, dur: 95,  stops: 0, price: 88500 },
  ];

  const FARE_MULT = { 'Economy': 1, 'Premium Economy': 1.35, 'Business': 1.9, 'First Class': 2.8 };
  const FARE_CLASS = { 'Economy': 'M', 'Premium Economy': 'W', 'Business': 'C', 'First Class': 'F' };
  const FARE_BAG = { 'Economy': '0PCS x 20KG', 'Premium Economy': '1PCS x 20KG', 'Business': '1PCS x 32KG', 'First Class': '2PCS x 40KG' };

  const fmtTime = m => {
    let h = Math.floor(m / 60) % 24, min = m % 60;
    const ap = h < 12 ? 'AM' : 'PM';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${String(min).padStart(2,'0')} ${ap}`;
  };
  const t2 = t => t.replace(/^(\d):/, '0$1:');
  const fmtDur = m => `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
  const fmtNaira = n => '₦' + n.toLocaleString('en-NG');
  const stopLabel = s => s === 0 ? 'Direct' : s === 1 ? '1 stop' : `${s} stops`;
  const farePrice = (f, fareName) => Math.round(f.price * (FARE_MULT[fareName] || 1) / 100) * 100;
  const flightNo = f => `${AIRLINES[f.al].code} ${720 + f._i * 7}`;
  FLIGHTS.forEach((f, i) => { f._i = i; });

  /* ---- selected legs ---- */
  const legs = [];
  const df = parseInt(params.get('df'), 10);
  if (!isNaN(df) && FLIGHTS[df]) {
    legs.push({ f: FLIGHTS[df], fare: params.get('dfare') || 'Economy',
      oCode: fromCode, dCode: toCode, oCity: fromCity, dCity: toCity, label: 'Outbound', date: departTxt });
  }
  const rf = parseInt(params.get('rf'), 10);
  if (!isNaN(rf) && FLIGHTS[rf]) {
    legs.push({ f: FLIGHTS[rf], fare: params.get('rfare') || 'Economy',
      oCode: toCode, dCode: fromCode, oCity: toCity, dCity: fromCity, label: 'Return', date: returnTxt });
  }

  function flightCardHTML(leg, idx) {
    const f = leg.f, a = AIRLINES[f.al];
    const arr = f.dep + f.dur;
    const open = idx === 0 ? ' open' : '';
    return `<article class="tv-fc${open}" data-fc="${idx}">
      <button type="button" class="tv-fc-head">
        <span class="tv-fc-label"><span class="tv-fc-tag">${leg.label}</span></span>
        <span class="tv-fc-air"><span class="al-badge" style="background:${a.color}">${initials(a.name)}</span><span class="tv-fc-air-txt"><b>${a.name}</b><small>${a.code}</small></span></span>
        <span class="tv-fc-date">${leg.date}</span>
        <span class="tv-fc-time">${t2(fmtTime(f.dep))} - ${t2(fmtTime(arr))}</span>
        <span class="tv-fc-meta">${stopLabel(f.stops)}, ${fmtDur(f.dur)}<small>${leg.fare}</small></span>
        <i class="ph ph-caret-down tv-fc-chevron"></i>
      </button>
      <div class="tv-fc-body">
        <div class="tv-it">
          <div class="tv-it-times">
            <div class="tv-it-pt"><b>${t2(fmtTime(f.dep))}</b><span>${leg.date}</span></div>
            <i class="ph ph-arrow-right"></i>
            <div class="tv-it-pt"><b>${t2(fmtTime(arr))}</b><span>${leg.date}</span></div>
          </div>
          <p class="tv-it-sub">${fmtDur(f.dur)} &nbsp;|&nbsp; Class: ${FARE_CLASS[leg.fare] || 'M'} &nbsp;|&nbsp; ${flightNo(f)}</p>
          <div class="tv-it-route">
            <span class="tv-it-line"><i class="ph ph-airplane"></i></span>
            <p>${leg.oCity} (${airportName(leg.oCode)}) — ${leg.dCity} (${airportName(leg.dCode)})</p>
          </div>
          <div class="tv-it-dest"><span>Destination</span><span>${leg.dCity} (${airportName(leg.dCode)})</span></div>
          <p class="tv-it-bag"><i class="ph ph-suitcase-rolling"></i> Free baggage: ${FARE_BAG[leg.fare] || '0PCS x 20KG'}</p>
        </div>
      </div>
    </article>`;
  }

  document.getElementById('tvFlights').innerHTML = legs.map(flightCardHTML).join('');
  document.getElementById('tvFlights').addEventListener('click', e => {
    const head = e.target.closest('.tv-fc-head');
    if (head) head.closest('.tv-fc').classList.toggle('open');
  });

  /* ---- essentials catalogue (for fare line items) ---- */
  const ESSENTIALS = {
    update:    { name: 'Travel Update', price: 1500 },
    info:      { name: 'Travel Information', price: 1000 },
    flexdate:  { name: 'Flexible Travel Date', price: 15000 },
    medrefund: { name: 'Medical Cancellation Refund', price: 5000 },
    wheelchair:{ name: 'Special Request — Wheelchair', price: 3450 },
    insurance: { name: 'Comprehensive Travel Insurance (30 days)', price: 25000 },
    lounge:    { name: 'Airport Lounge Access', price: 25000 },
    protocol:  { name: 'Onburd Protocol Service', price: 25000 },
    platinum:  { name: 'Kalabash Platinum Travel Card', price: 4500 },
    elite:     { name: 'Kalabash World Elite Travel Card', price: 25000 },
  };
  const addonIds = (params.get('addons') || '').split(',').filter(id => ESSENTIALS[id]);

  /* ---- totals ---- */
  const baseOverride = parseInt(params.get('basefare'), 10);
  const fareSubtotal = !isNaN(baseOverride) ? baseOverride : legs.reduce((s, l) => s + farePrice(l.f, l.fare), 0);
  const flightAmt = fareSubtotal * paxCount;
  const extrasTotal = addonIds.reduce((s, id) => s + ESSENTIALS[id].price, 0);
  const taxAmt = Math.round(flightAmt * 0.32);
  const dueAmt = flightAmt + taxAmt + extrasTotal;
  const pssNow = Math.round(dueAmt * 0.25 / 50) * 50;
  const pssBalance = dueAmt - pssNow;

  document.getElementById('tvPax').textContent = `Passenger x ${paxCount}`;
  document.getElementById('tvFlightAmt').textContent = fmtNaira(flightAmt);
  document.getElementById('tvTaxAmt').textContent = fmtNaira(taxAmt);
  document.getElementById('tvDueAmt').textContent = fmtNaira(dueAmt);
  document.getElementById('teSumExtras').innerHTML = addonIds.map(id =>
    `<div class="tv-sum-row te-sum-extra"><span>${ESSENTIALS[id].name}</span><span>${fmtNaira(ESSENTIALS[id].price)}</span></div>`
  ).join('');

  /* ---- payment method panels ---- */
  const METHODS = {
    pss: {
      title: 'Pay Small Small',
      desc: 'Pay 25% now and the balance in equal installments. Choose a flexible and convenient payment plan that works for you.',
      logo: `<img class="pm-logo-img" src="icons/pay-small-small.svg" alt="Pay Small Small" />`,
      amountLabel: 'Due now (25%)',
      amount: pssNow,
      sub: `Then ${fmtNaira(pssBalance)} in installments`,
      cta: 'Make Payment',
    },
    bank: {
      title: 'Paystack Bank Transfer',
      desc: 'Are your travel dates confirmed? If yes, go ahead and pay now. Transfer the exact amount to the account details shown after you continue.',
      logo: `<span class="pm-logo-badge"><i class="ph ph-bank"></i> Paystack</span>`,
      amountLabel: 'Amount',
      amount: dueAmt,
      sub: '',
      cta: 'Make payment',
    },
    card: {
      title: 'Paystack Cards',
      desc: 'Are your travel dates confirmed? If yes, go ahead and pay now. We accept Visa, Mastercard and Verve.',
      logo: `<span class="pm-logo-badge pm-logo-cards"><i class="ph ph-credit-card"></i> Visa · Mastercard · Verve</span>`,
      amountLabel: 'Amount',
      amount: dueAmt,
      sub: '',
      cta: 'Make payment',
    },
  };

  const pmPanel = document.getElementById('pmPanel');
  function renderPanel(key) {
    const m = METHODS[key];
    pmPanel.innerHTML = `
      <div class="pm-panel-body">
        <div class="pm-panel-top">
          <h3>${m.title}</h3>
          ${m.logo}
        </div>
        <p class="pm-panel-desc">${m.desc}</p>
      </div>
      <div class="pm-panel-foot">
        <div class="pm-amount">
          <span>${m.amountLabel}</span>
          <b>${fmtNaira(m.amount)}</b>
          ${m.sub ? `<small>${m.sub}</small>` : ''}
        </div>
        <button type="button" class="pm-pay" data-amount="${m.amount}">${m.cta}</button>
      </div>`;
  }
  renderPanel('pss');

  document.getElementById('pmTabs').addEventListener('click', e => {
    const tab = e.target.closest('.pm-tab');
    if (!tab) return;
    document.querySelectorAll('.pm-tab').forEach(t => t.classList.toggle('active', t === tab));
    renderPanel(tab.dataset.m);
  });

  /* ---- complete payment -> detailed flight success page ---- */
  const rnd = (set, len) => { let r = ''; for (let i = 0; i < len; i++) r += set[Math.floor(Math.random() * set.length)]; return r; };
  const ALNUM = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
  const bookingRef = () => rnd('0123456789', 9);
  const bookingId  = () => '4450' + rnd('0123456789', 8);
  const pnr        = () => rnd(ALNUM, 6) + rnd('0123456789', 6);
  const ticketNo   = () => rnd('0123456789', 13);
  const passportNo = () => `${rnd('0123456789',4)} ${rnd('0123456789',4)} ${rnd('0123456789',7)}`;

  function legData(leg) {
    const f = leg.f, a = AIRLINES[f.al];
    const arr = f.dep + f.dur;
    return {
      label: leg.label, date: leg.date,
      airline: a.name, airlineCode: a.code, color: a.color,
      depTime: t2(fmtTime(f.dep)), arrTime: t2(fmtTime(arr)),
      oCity: leg.oCity, oCode: leg.oCode, oAirport: airportName(leg.oCode),
      dCity: leg.dCity, dCode: leg.dCode, dAirport: airportName(leg.dCode),
      stops: stopLabel(f.stops), duration: fmtDur(f.dur),
      fare: leg.fare, fareClass: FARE_CLASS[leg.fare] || 'M',
      bag: FARE_BAG[leg.fare] || '0PCS x 20KG', flightNo: flightNo(f),
    };
  }

  let paxData = [];
  try { paxData = JSON.parse(decodeURIComponent(params.get('pax_data') || '[]')); } catch (e) {}
  if (!Array.isArray(paxData) || !paxData.length) paxData = [{}];

  pmPanel.addEventListener('click', e => {
    const btn = e.target.closest('.pm-pay');
    if (!btn) return;
    const paid = parseInt(btn.dataset.amount, 10);
    const method = document.querySelector('.pm-tab.active')?.dataset.m || 'card';
    const booking = {
      ref: bookingRef(),
      bookingId: bookingId(),
      date: new Date().toLocaleDateString('en-NG', { day: '2-digit', month: 'long', year: 'numeric' }),
      method, methodLabel: METHODS[method].title,
      partial: method === 'pss',
      amountPaid: paid,
      trip: { fromCity, fromCode, toCity, toCode, paxCount, cabin },
      legs: legs.map(legData),
      passengers: paxData.map(p => ({ ...p, pnr: pnr(), ticket: ticketNo(), passport: passportNo() })),
      fare: {
        flightAmt, taxAmt, extrasTotal, dueAmt,
        extras: addonIds.map(id => ({ name: ESSENTIALS[id].name, price: ESSENTIALS[id].price })),
      },
    };
    sessionStorage.setItem('onburd_flight_booking', JSON.stringify(booking));
    location.href = 'flight-success.html';
  });
</script>

</body>
</html>
